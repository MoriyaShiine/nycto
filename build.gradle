plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'io.github.ladysnake.chenille' version "${chenille_version}"
}

version = project.mod_version
group = project.maven_group

chenille {
    github = new URL("https://github.com/MoriyaShiine/nycto")
    javaVersion = 25
    configurePublishing {
        withLadysnakeMaven()
        withGithubRelease()
        withModrinthRelease()
        withCurseforgeRelease()
    }
}

loom {
    accessWidenerPath = file("src/main/resources/nycto.classtweaker")
}

fabricApi {
    configureDataGeneration() {
        client = true
        modId = project.archives_base_name
    }
}

repositories {
    chenille.repositories.ladysnake()
    chenille.repositories.up()
	maven {
		name = "TerraformersMC"
		url = "https://maven.gnomecraft.net/releases"
	}
    chenille.repositories.modrinth()
    chenille.repositories.jitpack()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"

    includeApi "org.ladysnake.cardinal-components-api:cardinal-components-level:${cardinal_components_version}"
    includeApi "maven.modrinth:midnightlib:${midnightlib_version}"
    includeApi "io.github.ladysnake:PlayerAbilityLib:${playerabilitylib_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "moriyashiine.strawberrylib:strawberrylib-fabric:${strawberrylib_version}"

    implementation "moriyashiine.anthropophagy:anthropophagy-fabric:${anthropophagy_version}"
    compileOnly "moriyashiine.hearty-meals:hearty-meals-fabric:${hearty_meals_version}"
    compileOnly "moriyashiine.superb-steeds:superb-steeds-fabric:${superb_steeds_version}"

    localRuntime "com.terraformersmc:modmenu:${mod_menu_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName"}
    }
}
